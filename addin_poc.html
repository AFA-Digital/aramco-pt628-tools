<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PT628 Add-in Proof of Concept</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; padding: 20px;
    background: #fafaf8;
    color: #2c2c2a;
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  #status { font-size: 13px; color: #5f5e5a; margin-bottom: 16px; }
  #counter {
    font-size: 48px; font-weight: 700; color: #185fa5; margin: 10px 0;
  }
  button {
    font-size: 16px; padding: 10px 24px; border-radius: 8px;
    border: 1px solid #C9A227; background: #C9A227; color: white;
    cursor: pointer; font-weight: 600;
  }
  #clock { font-size: 13px; color: #888780; margin-top: 16px; }
</style>
</head>
<body>
  <h1>PT 628 - Add-in Proof of Concept</h1>
  <div id="status">Loading...</div>
  <div id="counter">0</div>
  <button id="clickBtn">Click me during Slide Show</button>
  <div id="clock"></div>

<script>
let count = 0;
document.getElementById('clickBtn').addEventListener('click', function(){
  count++;
  document.getElementById('counter').textContent = count;
});

function tick(){
  document.getElementById('clock').textContent = 'Live clock: ' + new Date().toLocaleTimeString();
}
setInterval(tick, 1000);
tick();

Office.onReady(function(info){
  document.getElementById('status').textContent =
    'Running inside: ' + info.host + ' (platform: ' + info.platform + ')';
});
</script>
</body>
</html>
